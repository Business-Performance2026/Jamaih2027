<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#1f3a5f;--gold:#c9a227;--cream:#f8f3e3;--ink:#1d2433;--muted:#6b7280;--line:#e6e2d6;--ok:#1e7b3a;--okbg:#e3f5e9;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px}
header{background:var(--navy);color:#fff;padding:28px 18px 70px;text-align:center}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px}
header p{margin:8px 0 0;opacity:.85;font-size:15px}
.wrap{max-width:760px;margin:-50px auto 40px;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px rgba(31,58,95,.08)}
.stat b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.filters{background:var(--card);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;box-shadow:0 2px 10px rgba(31,58,95,.08);position:sticky;top:8px;z-index:5}
.filters label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
 background-position:14px 55%,9px 55%;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--gold)}
button{font:inherit;border:0;background:var(--gold);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.95)}
.person{display:none;background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin-top:14px}
.person.show{display:block}
.person h2{margin:0 0 10px;font-size:20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px;text-align:center}
.pgrid b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.pgrid span{font-size:12px;opacity:.8}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;margin-top:12px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--gold);border-left:2px solid var(--navy)}
.months{margin-top:14px;display:grid;gap:12px}
.month{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(31,58,95,.08)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:18px;color:var(--navy)}
.mhead .num{font-size:13px;color:var(--muted)}
.mhead .tot{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1eee5}
.row:last-child{border-bottom:0}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px}
.who small{color:var(--muted);font-size:13px}
.amt{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--navy)}
.done{display:inline-block;background:var(--okbg);color:var(--ok);font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;margin-inline-start:6px}
.empty{text-align:center;color:var(--muted);padding:30px;background:var(--card);border-radius:14px;margin-top:14px;display:none}
.next{background:linear-gradient(135deg,#c9a227,#e0bd4a);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(201,162,39,.3)}
.next .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.next .top b{font-size:16px;font-weight:800}
.next .cd{background:rgba(255,255,255,.25);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.next .ppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.next .p{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:20px;padding:4px 10px 4px 4px;font-size:14px}
.next .p i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:var(--navy)}
.next .p strong{color:var(--navy);font-variant-numeric:tabular-nums}
.next .after{margin-top:6px;font-size:12px;opacity:.95}
.ftitle{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);font-size:15px}
.ftitle svg{color:var(--gold)}
.shares{background:var(--card);border-radius:14px;padding:14px;margin-top:14px;box-shadow:0 2px 10px rgba(31,58,95,.08)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.sh{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:#fff;text-align:right;font:inherit;color:var(--ink)}
.sh:hover,.sh.on{border-color:var(--gold)}
.sh i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--navy);flex:none}
.sh b{display:block;font-size:15px}
.sh small{color:var(--muted);font-size:12px}
.sh strong{color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
@media (max-width:520px){
 header h1{font-size:26px}
 .filters{grid-template-columns:1fr 1fr}
 .filters button{grid-column:1/-1}
 .stat b{font-size:19px}
}
</style>
</head>
<body>
<header>
  <h1>جمعية 2027</h1>
  <p>جدول الاستلام الشهري · يناير – ديسمبر 2027</p>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="sMonth"></b><span>ريال كل شهر</span></div>
    <div class="stat"><b id="sCount"></b><span>عضو</span></div>
    <div class="stat"><b id="sTotal"></b><span>مجموع الجمعية</span></div>
  </div>

  <div class="next" id="next"></div>

  <div class="filters">
    <div class="ftitle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4z"/></svg>فلتر بالشهر أو الاسم</div>
    <div><label for="fName">الاسم</label><select id="fName"><option value="">الكل</option></select></div>
    <div><label for="fMonth">الشهر</label><select id="fMonth"><option value="">كل الأشهر</option></select></div>
    <button id="reset" type="button">عرض الكل</button>
  </div>

  <div class="shares">
    <div class="ftitle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .3 5.5 2.7 5.5 5.8"/></svg>الأعضاء وسهم كل واحد</div>
    <div class="sgrid" id="sgrid"></div>
  </div>

  <div class="person" id="person"></div>
  <div class="months" id="months"></div>
  <div class="empty" id="empty">ما فيه استلام لهذا الاختيار</div>
  <footer>كل عضو يستلم مجموع ما يدفعه خلال السنة (الدفع الشهري × 12)</footer>
</div>

<script>
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const MEMBERS={"حسن":350,"عمار":300,"أماني":300,"محمد":300,"جوخة":500,"سحر":200,"مروة":200,"عبدالعزيز":350,"أمل":400,"بدرية":250,"تهاني":300,"محمود":700,"حفصة":1500};
const COLORS={"حسن":"#d0ece7","مروة":"#f8d7e3","عمار":"#d6eaf8","أماني":"#e8daef","محمد":"#fff3c4","عبدالعزيز":"#d5f5e3","سحر":"#fdebd0","جوخة":"#fcf3cf","أمل":"#d1f2eb","بدرية":"#fadbd8","تهاني":"#ebdef0","محمود":"#d4e6f1","حفصة":"#fde2e1"};
const PLAN=[
["يناير","حسن",2400],["يناير","عمار",3250],
["فبراير","عمار",350],["فبراير","أماني",3600],["فبراير","محمد",1700],
["مارس","جوخة",4000],["مارس","سحر",1650],
["أبريل","عبدالعزيز",4200],["أبريل","سحر",750],["أبريل","مروة",700],
["مايو","أمل",3650],["مايو","جوخة",2000],
["يونيو","بدرية",2650],["يونيو","محمد",1900],["يونيو","محمود",1100],
["يوليو","تهاني",3600],["يوليو","بدرية",350],["يوليو","مروة",1700],
["أغسطس","محمود",5650],
["سبتمبر","حفصة",3850],["سبتمبر","حسن",1800],
["أكتوبر","حفصة",5650],["نوفمبر","حفصة",5650],
["ديسمبر","حفصة",2850],["ديسمبر","أمل",1150],["ديسمبر","محمود",1650]];
const fmt=n=>n.toLocaleString("en-US");

// annotate each payment: part number, total parts, cumulative
const counts={},seen={},cum={};
PLAN.forEach(([,n])=>counts[n]=(counts[n]||0)+1);
const ROWS=PLAN.map(([m,n,a])=>{
  seen[n]=(seen[n]||0)+1; cum[n]=(cum[n]||0)+a;
  const due=MEMBERS[n]*12, full=counts[n]===1, last=cum[n]===due;
  let note = full ? "استلام كامل" : `دفعة ${seen[n]} من ${counts[n]}`;
  return {m,n,a,note,last};
});

const fName=document.getElementById("fName"),fMonth=document.getElementById("fMonth");
Object.keys(MEMBERS).forEach(n=>fName.add(new Option(n,n)));
MONTHS.forEach(m=>fMonth.add(new Option(m,m)));

function renderShares(){
  const g=document.getElementById("sgrid"),n=fName.value;
  g.innerHTML=Object.entries(MEMBERS).map(([k,v])=>`<button type="button" class="sh${k===n?" on":""}" data-n="${k}"><i style="background:${COLORS[k]}">${k[0]}</i>
    <span><b>${k}</b><small>السهم <strong>${fmt(v)}</strong> ريال<br>حقه ${fmt(v*12)}</small></span></button>`).join("");
  g.querySelectorAll(".sh").forEach(el=>el.onclick=()=>{fName.value=fName.value===el.dataset.n?"":el.dataset.n;render()});
}
function render(){
  const n=fName.value,m=fMonth.value;
  renderShares();
  const box=document.getElementById("months");box.innerHTML="";
  let any=false;
  MONTHS.forEach((mon,i)=>{
    if(m&&mon!==m)return;
    const rs=ROWS.filter(r=>r.m===mon&&(!n||r.n===n));
    if(!rs.length)return;
    any=true;
    const total=ROWS.filter(r=>r.m===mon).reduce((s,r)=>s+r.a,0);
    const card=document.createElement("div");card.className="month";
    card.innerHTML=`<div class="mhead"><div><h3>${mon}</h3><span class="num">الشهر ${i+1}</span></div><div class="tot">${fmt(total)} ريال</div></div>`+
      rs.map(r=>`<div class="row"><div class="dot" style="background:${COLORS[r.n]}">${r.n[0]}</div>
        <div class="who"><b>${r.n}${r.last?'<span class="done">✓ اكتمل حقه</span>':''}</b><small>${r.note}</small></div>
        <div class="amt">${fmt(r.a)}</div></div>`).join("");
    box.appendChild(card);
  });
  document.getElementById("empty").style.display=any?"none":"block";

  const p=document.getElementById("person");
  if(n){
    const due=MEMBERS[n]*12,mine=ROWS.filter(r=>r.n===n);
    p.innerHTML=`<h2>${n}</h2><div class="pgrid">
      <div><b>${fmt(MEMBERS[n])}</b><span>تدفع شهرياً</span></div>
      <div><b>${fmt(due)}</b><span>حقك كامل</span></div>
      <div><b>${mine.length}</b><span>${mine.length===1?"استلام واحد":"دفعات"}</span></div></div>
      <div class="bar">${mine.map(r=>`<i style="width:${r.a/due*100}%" title="${r.m}"></i>`).join("")}</div>
      <div style="margin-top:8px;font-size:14px;opacity:.9">تستلم في: ${mine.map(r=>`${r.m} (${fmt(r.a)})`).join(" · ")}</div>`;
    p.classList.add("show");
  } else p.classList.remove("show");
}
function renderNext(){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  // index of the next payout month in 2027 (0..11), or -1 if finished
  let idx = y<2027 ? 0 : (y===2027 ? mo+1 : 12);
  const el=document.getElementById("next");
  if(idx>11){el.innerHTML=`<div class="top"><b>انتهت الجمعية 🌟</b></div><div class="after">كل الأعضاء استلموا حقهم كامل.</div>`;return;}
  const mon=MONTHS[idx], rs=ROWS.filter(r=>r.m===mon);
  const target=new Date(2027,idx,1), days=Math.max(0,Math.ceil((target-now)/864e5));
  const nxt=idx<11?ROWS.filter(r=>r.m===MONTHS[idx+1]).map(r=>r.n).join("، "):"";
  el.innerHTML=`<div class="top"><div>الشهر القادم: <b>${mon} 2027</b></div><span class="cd">باقي ${days} يوم</span></div>
    <div class="ppl">${rs.map(r=>`<div class="p"><i style="background:${COLORS[r.n]}">${r.n[0]}</i>${r.n} <strong>${fmt(r.a)}</strong></div>`).join("")}</div>
    ${nxt?`<div class="after">وبعده (${MONTHS[idx+1]}): ${nxt}</div>`:""}`;
}
const MONTHLY=Object.values(MEMBERS).reduce((x,y)=>x+y,0);
document.getElementById("sMonth").textContent=fmt(MONTHLY);
document.getElementById("sCount").textContent=Object.keys(MEMBERS).length;
document.getElementById("sTotal").textContent=fmt(MONTHLY*12);
renderNext();
fName.onchange=fMonth.onchange=render;
document.getElementById("reset").onclick=()=>{fName.value="";fMonth.value="";render()};
render();
</script>
</body>
</html>
